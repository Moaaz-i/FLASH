<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#9d4edd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Shield / Cylinder Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGlow)" />

  <!-- Outer Quantum Hexagon / Shield Frame -->
  <polygon points="250,50 420,140 420,360 250,450 80,360 80,140" 
           fill="none" 
           stroke="url(#shieldGrad)" 
           stroke-width="6" 
           stroke-dasharray="16 8"
           opacity="0.75" />

  <!-- Inner High-Tech Shield Background -->
  <path d="M 250 80 L 390 155 L 390 330 C 390 380 250 425 250 425 C 250 425 110 380 110 330 L 110 155 Z" 
        fill="#0b0f19" 
        stroke="rgba(0, 242, 254, 0.4)" 
        stroke-width="3" />

  <!-- Database Disk Layers Behind Lightning -->
  <g opacity="0.3" stroke="#00f2fe" stroke-width="2" fill="none">
    <!-- Cylinder 1 -->
    <ellipse cx="250" cy="180" rx="90" ry="24" />
    <path d="M 160 180 v 40 a 90 24 0 0 0 180 0 v -40" />
    <!-- Cylinder 2 -->
    <path d="M 160 230 v 40 a 90 24 0 0 0 180 0 v -40" />
    <!-- Cylinder 3 -->
    <path d="M 160 280 v 40 a 90 24 0 0 0 180 0 v -40" />
  </g>

  <!-- Central Dynamic FLASH Lightning Bolt -->
  <path d="M 270 100 L 160 260 L 240 260 L 220 400 L 340 230 L 260 230 Z" 
        fill="url(#boltGrad)" 
        filter="url(#intenseGlow)" />

  <!-- Cryptographic Padlock Ring Core -->
  <circle cx="250" cy="245" r="16" fill="#07090e" stroke="#00f5a0" stroke-width="4" filter="url(#neonGlow)"/>
  <circle cx="250" cy="245" r="5" fill="#00f5a0" />

  <!-- Circuit nodes & Orbiting dots -->
  <circle cx="80" cy="140" r="6" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="420" cy="140" r="6" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="420" cy="360" r="6" fill="#9d4edd" filter="url(#neonGlow)" />
  <circle cx="80" cy="360" r="6" fill="#9d4edd" filter="url(#neonGlow)" />
  <circle cx="250" cy="50" r="8" fill="#00f5a0" filter="url(#neonGlow)" />
  <circle cx="250" cy="450" r="8" fill="#00f5a0" filter="url(#neonGlow)" />
</svg>
